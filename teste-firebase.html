<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste de sincronização</title><style>body{font:16px Arial;margin:0;background:#edf2f7;color:#071d49}header{background:#071d49;color:white;padding:24px}main{max-width:760px;margin:24px auto;padding:16px}section{background:white;padding:24px;border-radius:10px;margin-bottom:16px}input,button{font:inherit;padding:10px;margin:6px 0}input{max-width:100%;box-sizing:border-box}button{background:#24591b;color:white;border:0;border-radius:5px;cursor:pointer}label{display:block}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ccd5df;text-align:left}td input{width:100%}[hidden]{display:none!important}#status{white-space:pre-wrap}</style><header><h1>Planejamento Semanal — Teste</h1>Somente dados fictícios</header><main><section id="login"><form id="form"><label>E-mail<br><input id="email" type="email" required autocomplete="username"></label><label>Senha exclusiva do teste<br><input id="senha" type="password" required autocomplete="current-password"></label><button>Entrar</button></form></section><section id="painel" hidden><button id="sair">Sair</button><h2>Terminal A</h2><table><tr><th>Filial</th><th>Plano diário (t)</th><th>Previsão D (t)</th></tr><tr><td>Filial 1</td><td><input type="number" min="0" step="any" data-key="plano1"></td><td><input type="number" min="0" step="any" data-key="prev1"></td></tr><tr><td>Filial 2</td><td><input type="number" min="0" step="any" data-key="plano2"></td><td><input type="number" min="0" step="any" data-key="prev2"></td></tr></table><button id="limpar">Limpar previsão</button><h3 id="saldo"></h3><label id="motivoLabel" hidden>Motivo da diferença<br><input data-key="motivo" maxlength="300"></label></section><section id="status" role="status">Carregando SDK...</section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js';
import {getDatabase,ref,onValue,update} from 'https://www.gstatic.com/firebasejs/13.4.0/firebase-database.js';
const app=initializeApp({apiKey:'AIzaSyD7eyQ2hiWO-Fn8bIcPn3gaMxBRw6KLT_k',authDomain:'planejamento-semanal-8597b.firebaseapp.com',databaseURL:'https://planejamento-semanal-8597b-default-rtdb.firebaseio.com',projectId:'planejamento-semanal-8597b',appId:'1:566837268705:web:e39b57185dafd7e1e0a7a0'});
const auth=getAuth(app),db=getDatabase(app),base=ref(db,'testeSincronizacao'),$=id=>document.getElementById(id),fields=[...document.querySelectorAll('[data-key]')];let unsub=[],ready=false,online=false,data={};
function render(){const p=Number(data.plano1||0)+Number(data.plano2||0),v=Number(data.prev1||0)+Number(data.prev2||0);$('saldo').textContent=`Plano: ${p} t | Previsão: ${v} t | Saldo: ${p-v} t`;$('motivoLabel').hidden=p===v;}
function controls(){fields.forEach(f=>f.disabled=!(ready&&online));$('limpar').disabled=!(ready&&online);}
function error(e){$('status').textContent='Erro: '+(e.code||e.message);}
$('form').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('email').value,$('senha').value);$('senha').value='';}catch(e){error(e);}};
$('sair').onclick=()=>signOut(auth).catch(error);
onAuthStateChanged(auth,user=>{unsub.forEach(f=>f());unsub=[];ready=false;online=false;data={};fields.forEach(f=>f.value='');controls();$('login').hidden=!!user;$('painel').hidden=!user;$('status').textContent=user?'Conectando...':'Entre para iniciar o teste.';if(!user)return;unsub.push(onValue(ref(db,'.info/connected'),s=>{online=s.val()===true;controls();$('status').textContent=online?(ready?'Online — sincronização ativa':'Online — aguardando dados'):'Offline — edição bloqueada';}));unsub.push(onValue(base,s=>{data=s.val()||{};ready=true;fields.forEach(f=>{if(document.activeElement!==f)f.value=data[f.dataset.key]??(f.type==='number'?0:'');});render();controls();if(online)$('status').textContent='Online — dados recebidos';},e=>{ready=false;controls();error(e);}));});
async function save(values){if(!ready||!online)return;try{await update(base,values);$('status').textContent='Online — alteração confirmada';}catch(e){error(e);}}
fields.forEach(f=>{f.addEventListener('change',()=>{if(!f.checkValidity())return;save({[f.dataset.key]:f.type==='number'?Number(f.value):f.value});});f.addEventListener('blur',()=>{if(!f.checkValidity())f.value=data[f.dataset.key]??0;});});$('limpar').onclick=()=>save({prev1:0,prev2:0});
</script></html>
