<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planejamento — Teste</title><style>body{font:16px Arial;margin:0;background:#eef2f7;color:#071d49}header{background:#071d49;color:white;padding:24px}main{max-width:1000px;margin:24px auto;padding:16px}section{background:white;padding:20px;border-radius:8px;margin-bottom:16px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccd5df;padding:12px;text-align:left}th{background:#245c16;color:white}input,select{font:inherit;padding:8px;width:100px;max-width:90%}small{display:block;margin:12px 0}button{background:#245c16;color:white;border:0;padding:10px;border-radius:5px;cursor:pointer}</style></head><body><header><h1>Planejamento Semanal de Embarques</h1>Ambiente demonstrativo — dados fictícios</header><main><section><label>Produto <select id="produto"><option>Soja</option><option>Milho</option><option>Sorgo</option><option>Trigo</option></select></label> <label>Dias <input id="dias" type="number" min="1" max="7" value="5"></label><small>Teste de hospedagem: os dados ficam somente nesta página e não são sincronizados.</small></section><section><h2>Planejamento e previsão</h2><table><thead><tr><th>Filial</th><th>Terminal</th><th>Plano diário (t)</th><th>Previsão D (t)</th></tr></thead><tbody id="linhas"></tbody></table><p><button id="limpar">Limpar previsão</button></p></section><section><h2>Consolidado — Terminal A</h2><p id="total"></p><label id="motivoLabel" hidden>Motivo da diferença <input id="motivo" style="width:65%"></label></section></main><script>const $=id=>document.getElementById(id);const dados={};function estado(){return dados[$('produto').value]??=( {dias:5,plano:[0,0],prev:[0,0],motivo:''});}function calc(){const s=estado(),p=s.plano.reduce((a,b)=>a+b,0),d=s.prev.reduce((a,b)=>a+b,0);$('total').textContent=`Plano diário: ${p} t | Plano semanal: ${p*s.dias} t | Previsão D: ${d} t | Saldo diário: ${p-d} t`;$('motivoLabel').hidden=p===d;}function render(){const s=estado();$('dias').value=s.dias;$('motivo').value=s.motivo;$('linhas').innerHTML='';for(let i=0;i<2;i++){const tr=document.createElement('tr');tr.innerHTML=`<td>Filial ${i+1}</td><td>Terminal A</td><td><input aria-label="Plano filial ${i+1}" type="number" min="0" value="${s.plano[i]}"></td><td><input aria-label="Previsão filial ${i+1}" type="number" min="0" value="${s.prev[i]}"></td>`;tr.querySelectorAll('input').forEach((el,j)=>el.oninput=()=>{s[j?'prev':'plano'][i]=Math.max(0,Number(el.value)||0);calc()});$('linhas').append(tr)}calc()}$('produto').onchange=render;$('dias').oninput=()=>{estado().dias=Math.min(7,Math.max(1,Number($('dias').value)||1));calc()};$('motivo').oninput=()=>estado().motivo=$('motivo').value;$('limpar').onclick=()=>{estado().prev=[0,0];render()};render();</script></body></html>
